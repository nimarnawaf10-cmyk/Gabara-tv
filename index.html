<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b14" />
<title>Gabara TV</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="file_00000000b57c8210bbc5324d422d131f.png" />
<link rel="apple-touch-icon" href="file_00000000b57c8210bbc5324d422d131f.png" />
<style>
:root{--bg:#070b14;--s1:#111827;--s2:#1a2336;--bd:#25324d;--p:#f59e0b;--ac:#38bdf8;--tx:#f8fafc;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:36px;min-height:100vh}
.topbar{background:rgba(17,24,39,.95);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.logo{font-size:19px;font-weight:700;color:var(--p)}
.refresh-btn{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
.main{max-width:960px;margin:0 auto;padding:10px}
.player-card{background:#000;border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
video{width:100%;height:100%;display:block;background:#000}
.player-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:radial-gradient(circle,#162036,#070b14);color:var(--mu);gap:6px}
.now-playing{background:var(--s1);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd)}
.np-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-status{font-size:11px;color:var(--mu);margin-top:2px}
.live-dot{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.45);display:none}
.live-dot.active{display:inline-block}
.search-input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:13px;outline:none;margin-bottom:10px}
.cats-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.cats-bar::-webkit-scrollbar{display:none}
.cat-pill{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);color:var(--mu);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.cat-pill.active{background:var(--p);color:#070b14;border-color:var(--p)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mu);gap:8px}
.view-btn{background:var(--s2);color:var(--ac);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.ch-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:8px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;cursor:pointer}
.ch-card.playing{border-color:var(--p);background:linear-gradient(180deg,rgba(245,158,11,.16),var(--s1))}
.ch-logo{width:46px;height:46px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.ch-logo img{width:100%;height:100%;object-fit:cover}
.ch-name{font-size:12px;font-weight:700;line-height:1.25;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ch-cat{display:none;font-size:10px;color:var(--ac);background:rgba(56,189,248,.12);padding:3px 7px;border-radius:999px;flex-shrink:0}
.grid.list-view{grid-template-columns:1fr;gap:6px}
.grid.list-view .ch-card{flex-direction:row;text-align:right;padding:7px 10px;gap:10px}
.grid.list-view .ch-logo{width:42px;height:42px}
.grid.list-view .ch-name{font-size:13px;flex:1;display:block;white-space:nowrap;text-overflow:ellipsis}
.grid.list-view .ch-cat{display:block}
.empty-box{grid-column:1/-1;text-align:center;padding:24px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;color:var(--mu);font-size:13px}
</style>
<script defer src="app.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<header class="topbar"><div class="logo">📺 Gabara TV</div><button class="refresh-btn" id="btnRefresh">🔄 تحديث</button></header>
<main class="main">
  <section class="player-card">
    <div class="video-wrap">
      <video id="videoPlayer" controls playsinline></video>
      <div id="placeholder" class="player-placeholder"><div style="font-size:36px">📡</div><div style="font-size:14px;color:#f8fafc;font-weight:700">أهلاً بك في Gabara TV</div><div style="font-size:12px">اضغط على أي قناة بالأسفل لبدء المشاهدة</div></div>
    </div>
    <div class="now-playing"><div style="min-width:0;flex:1"><div id="npTitle" class="np-title">لم يتم اختيار قناة بعد</div><div id="npStatus" class="np-status">اختر قسماً أو قناة</div></div><span id="liveDot" class="live-dot">● مباشر</span></div>
  </section>
  <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن قناة..." />
  <div id="catsBar" class="cats-bar"></div>
  <div class="section-head"><span id="listLabel">كل القنوات</span><div style="display:flex;gap:8px;align-items:center"><button class="view-btn" id="btnView">☰ قائمة</button><span id="chCounter">0 قناة</span></div></div>
  <div id="channelsGrid" class="grid"><div class="empty-box">جاري تحميل القنوات...</div></div>
</main>
<script>
const g=document.getElementById("channelsGrid"),vb=document.getElementById("btnView");
function setV(l){g.classList.toggle("list-view",l);vb.textContent=l?"⊞ مربعات":"☰ قائمة";try{localStorage.setItem("gtv_v",l?"1":"0");}catch{}}
try{setV(localStorage.getItem("gtv_v")==="1");}catch{setV(false);}
vb.onclick=()=>setV(!g.classList.contains("list-view"));
</script>
</body>
</html>
