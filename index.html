<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Gabara TV</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="file_00000000b57c8210bbc5324d422d131f.png" />
  <link rel="apple-touch-icon" href="file_00000000b57c8210bbc5324d422d131f.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --surface: #111827;
      --surface-2: #1a2336;
      --border: #25324d;
      --primary: #f59e0b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      min-height: 100vh;
    }

    .topbar {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .refresh-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
    }

    .player-card {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle at center, #162036, #070b14);
      color: var(--muted);
      gap: 8px;
    }
