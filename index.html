<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabara TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --surface: #111827;
      --surface-2: #1a2336;
      --border: #25324d;
      --primary: #f59e0b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      min-height: 100vh;
    }

    /* الهيدر */
    .topbar {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .refresh-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
    }

    /* مشغل الفيديو */
    .player-card {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle at center, #162036, #070b14);
      color: var(--muted);
      gap: 8px;
    }

    .player-placeholder .big-icon {
      font-size: 42px;
    }

    .now-playing {
      background: var(--surface);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    .np-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .live-dot {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
      flex-shrink: 0;
      display: none;
    }

    .live-dot.active {
      display: inline-block;
    }

    /* البحث */
    .search-box {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* شريط الأقسام */
    .cats-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .cats-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      white-space: nowrap;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #070b14;
      border-color: var(--primary);
    }

    /* شبكة القنوات */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .ch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .ch-card:active {
      transform: scale(0.97);
    }

    .ch-card.playing {
      border-color: var(--primary);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.14), var(--surface));
    }

    .ch-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      overflow: hidden;
    }

    .ch-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ch-name {
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-cat {
      font-size: 11px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 3px 8px;
      border-radius: 999px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">📺 Gabara TV</div>
    <button class="refresh-btn" id="btnRefresh">🔄 تحديث</button>
  </header>

  <main class="main">
    <!-- مشغل البث -->
    <section class="player-card">
      <div class="video-wrap">
        <video id="videoPlayer" controls playsinline></video>
        <div id="placeholder" class="player-placeholder">
          <div class="big-icon">📡</div>
          <div style="font-size: 15px; color: #f8fafc; font-weight: bold;">أهلاً بك في Gabara TV</div>
          <div style="font-size: 13px;">اضغط على أي قناة بالأسفل لبدء المشاهدة</div>
        </div>
      </div>
      <div class="now-playing">
        <div style="min-width: 0; flex: 1;">
          <div id="npTitle" class="np-title">لم يتم اختيار قناة بعد</div>
          <div id="npStatus" class="np-status">اختر قسماً أو قناة من القائمة</div>
        </div>
        <span id="liveDot" class="live-dot">● مباشر</span>
      </div>
    </section>

    <!-- البحث -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن قناة..." />
    </div>

    <!-- الأقسام -->
    <div id="catsBar" class="cats-bar"></div>

    <!-- القنوات -->
    <div class="section-head">
      <span id="listLabel">كل القنوات</span>
      <span id="chCounter">0 قناة</span>
    </div>
    <div id="channelsGrid" class="grid">
      <div class="empty-box">جاري تحميل القنوات...</div>
    </div>
  </main>

  <script>
    const DB_URL = "https://gabara-tv-default-rtdb.europe-west1.firebasedatabase.app";

    let categories = {};
    let channels = {};
    let activeCat = "all";
    let activeChId = null;
    let hlsInstance = null;

    const video = document.getElementById("videoPlayer");
    const placeholder = document.getElementById("placeholder");
    const npTitle = document.getElementById("npTitle");
    const npStatus = document.getElementById("npStatus");
    const liveDot = document.getElementById("liveDot");
    const catsBar = document.getElementById("catsBar");
    const channelsGrid = document.getElementById("channelsGrid");
    const searchInput = document.getElementById("searchInput");
    const listLabel = document.getElementById("listLabel");
    const chCounter = document.getElementById("chCounter");

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadData() {
      npStatus.textContent = "جاري تحديث القنوات...";
      try {
        const [catRes, chRes] = await Promise.all([
          fetch(`${DB_URL}/categories.json`),
          fetch(`${DB_URL}/channels.json`)
        ]);
        if (!catRes.ok || !chRes.ok) throw new Error();

        categories = (await catRes.json()) || {};
        channels = (await chRes.json()) || {};

        renderCategories();
        renderChannels();
        if (!activeChId) {
          npStatus.textContent = "اختر قسماً أو قناة من القائمة";
        }
      } catch (err) {
        channelsGrid.innerHTML = '<div class="empty-box">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت واضغط تحديث 🔄</div>';
        npStatus.textContent = "خطأ في الاتصال بالإنترنت";
      }
    }

    function renderCategories() {
      const catEntries = Object.entries(categories);
      const allCount = Object.keys(channels).length;

      let html = `
        <button class="cat-pill ${activeCat === "all" ? "active" : ""}" data-cat="all">
          📺 الكل (${allCount})
        </button>
      `;

      html += catEntries.map(([id, cat]) => {
        const count = Object.values(channels).filter(c => c.categoryId === id).length;
        return `
          <button class="cat-pill ${activeCat === id ? "active" : ""}" data-cat="${escapeHtml(id)}">
            ${escapeHtml(cat.icon || "📺")} ${escapeHtml(cat.name)} (${count})
          </button>
        `;
      }).join("");

      catsBar.innerHTML = html;
    }

    function renderChannels() {
      const query = searchInput.value.trim().toLowerCase();
      const entries = Object.entries(channels);

      if (activeCat === "all") {
        listLabel.textContent = "كل القنوات";
      } else {
        const cat = categories[activeCat];
        listLabel.textContent = cat ? `${cat.icon || "📺"} ${cat.name}` : "القنوات";
      }

      const filtered = entries.filter(([, ch]) => {
        const matchCat = activeCat === "all" || ch.categoryId === activeCat;
        const matchSearch = !query || (ch.name || "").toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      chCounter.textContent = `${filtered.length} قناة`;

      if (filtered.length === 0) {
        channelsGrid.innerHTML = '<div class="empty-box">لا توجد قنوات في هذا القسم حالياً</div>';
        return;
      }

      channelsGrid.innerHTML = filtered.map(([id, ch]) => {
        const cat = categories[ch.categoryId];
        const catName = cat ? `${cat.icon || "📺"} ${cat.name}` : "عام";
        const isPlaying = id === activeChId;

        const logoHtml = ch.logoUrl
          ? `<img src="${escapeHtml(ch.logoUrl)}" alt="" onerror="this.parentElement.textContent='📡'">`
          : "📡";

        return `
          <div class="ch-card ${isPlaying ? "playing" : ""}" data-ch-id="${escapeHtml(id)}">
            <div class="ch-logo">${logoHtml}</div>
            <div class="ch-name">${escapeHtml(ch.name)}</div>
            <div class="ch-cat">${escapeHtml(catName)}</div>
          </div>
        `;
      }).join("");
    }

    function playChannel(id) {
      const ch = channels[id];
      if (!ch || !ch.streamUrl) return;

      activeChId = id;
      renderChannels();

      placeholder.style.display = "none";
      npTitle.textContent = ch.name;
      npStatus.textContent = "جاري تشغيل البث...";
      liveDot.classList.remove("active");

      // تنظيف أي مشغل سابق
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();

      const url = ch.streamUrl.trim();
      const isHls = url.toLowerCase().includes(".m3u8");

      if (isHls && window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          npStatus.textContent = "البث يعمل الآن";
          liveDot.classList.add("active");
          video.play().catch(() => {
            npStatus.textContent = "اضغط على زر التشغيل في الفيديو ▶";
          });
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              npStatus.textContent = "تعذر تشغيل البث — قد يكون الرابط متوقفاً ❌";
              liveDot.classList.remove("active");
            }
          }
        });
      } else {
        video.src = url;
        video.play().then(() => {
          npStatus.textContent = "البث يعمل الآن";
          liveDot.classList.add("active");
        }).catch(() => {
          npStatus.textContent = "اضغط على زر التشغيل في الفيديو ▶";
        });
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // الأحداث
    catsBar.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      activeCat = btn.getAttribute("data-cat");
      renderCategories();
      renderChannels();
    });

    channelsGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".ch-card[data-ch-id]");
      if (!card) return;
      playChannel(card.getAttribute("data-ch-id"));
    });

    searchInput.addEventListener("input", renderChannels);
    document.getElementById("btnRefresh").addEventListener("click", loadData);

    // تشغيل أولي
    loadData();
  </script>
</body>
</html>
